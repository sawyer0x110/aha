</main><script>
const titles = [
  'Keep the research. Change the expression.',
  'Reuse the meaning, not the same layout.',
  'A changed source needs a new output.',
  'Local execution is not permission to send speech.',
  'A matching hash is not a quality verdict.'
];
const messages = [
  'Two skills: research for a report; explain for a visual artifact.',
  'Each medium is separately authored against the same research snapshot.',
  'The old receipt still identifies revision A. Rebuild to link revision B.',
  'The gate represents user approval of this exact plan, not an automatic check.',
  'Review the evidence, the actual artifact and the reader experience separately.'
];
const byId = id => document.getElementById(id);
window.ahaVideo = { renderFrame({ segmentIndex, segmentFrame, segmentFrames }) {
  const scene = Math.min(4, Math.max(0, segmentIndex));
  const p = segmentFrames > 1 ? segmentFrame / (segmentFrames - 1) : 1;
  byId('title').textContent = titles[scene];
  byId('message').textContent = messages[scene];
  byId('pipeline').setAttribute('visibility', scene === 1 || scene === 3 ? 'hidden' : 'visible');
  byId('media').setAttribute('visibility', scene === 1 ? 'visible' : 'hidden');
  byId('approval').setAttribute('visibility', scene === 3 ? 'visible' : 'hidden');
  byId('packet').setAttribute('cx', String(scene === 2 ? 650 + Math.min(1, Math.max(0, (p - .55) / .2)) * 125 : 270 + p * 495));
  byId('packet').setAttribute('visibility', scene === 1 || scene === 3 || (scene === 2 && p < .55) ? 'hidden' : 'visible');
  byId('source-version').textContent = scene === 2 && p >= .2 ? 'Source revision B' : 'Source revision A';
  byId('output-version').textContent = scene === 2 && p >= .75 ? 'Output revision B' : 'Output revision A';
  byId('project-box').setAttribute('class', scene === 2 && p >= .2 ? 'box focus' : 'box');
  byId('output-box').setAttribute('class', scene === 2 && p >= .75 ? 'box focus' : 'box');
  const branch = Math.min(3, Math.floor(p * 4));
  for (let i = 0; i < 4; i++) byId(`media-${i}`).querySelector('rect').setAttribute('class', i === branch ? 'box focus' : 'box');
  byId('branch-packet').setAttribute('cy', String(48 + branch * 70));
  byId('branch-packet').setAttribute('cx', String(350 + (p * 4 % 1) * 112));
  const approved = p >= .55;
  byId('barrier').setAttribute('y2', approved ? '82' : '212');
  byId('gate-label').textContent = approved ? 'Exact current plan approved' : 'Await exact-plan approval';
  byId('speech-packet').setAttribute('cx', String(approved ? 580 + ((p - .55) / .45) * 198 : 314 + Math.min(1, p / .4) * 225));
} };
</script>
