<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why a later Docker RUN hides a file but keeps its payload</title>
<style>
:root, html[data-theme="light"], html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #101923; --cp-bg-elevated: #182635; --cp-surface: #182635;
  --cp-surface-soft: #223547; --cp-border: #728699; --cp-border-strong: #a0b2c3;
  --cp-text: #f4f6f8; --cp-text-muted: #c0ceda; --cp-text-soft: #b4c5d3;
  --cp-accent: #ffce7a; --cp-accent-hover: #ffe2ad; --cp-accent-soft: #493b29;
  --cp-accent-fg: #101923; --cp-success: #96e6cb; --cp-danger: #ffaaa5;
  --cp-warning: #ffce7a; --cp-link: #aacfff; --cp-shadow: none;
  --cp-overlay: #101923; --cp-panel: #182635; --cp-panel-strong: #182635;
  --cp-sheen: #223547; --cp-highlight: #493b29;
}
* { box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; margin: 0; }
body { background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Arial, sans-serif; }
svg { display: block; width: 1280px; height: 720px; }
text { fill: var(--cp-text); font-size: 23px; }
.title { font-size: 36px; font-weight: 700; }
.eyebrow { font-size: 17px; letter-spacing: 2px; fill: var(--cp-text-muted); }
.heading { font-size: 25px; font-weight: 650; }
.small { font-size: 19px; fill: var(--cp-text-muted); }
.source { font-size: 17px; fill: var(--cp-text-muted); }
.mono { font-family: Consolas, "Courier New", monospace; }
.payload { fill: #ffce7a; }
.ink { fill: #101923; font-weight: 700; }
.mint { fill: #96e6cb; }
.violet { fill: #d5b7ff; }
.panel { fill: var(--cp-surface); stroke: var(--cp-border); stroke-width: 2; }
.line { fill: none; stroke: var(--cp-border-strong); stroke-width: 2; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">Why a later Docker RUN hides a file but keeps its payload</title>
  <desc id="scene-desc">A persistent cutaway separates immutable stored layers from the merged file view. A second lane compares creating and deleting a new file before a single RUN ends.</desc>
  <text x="48" y="35" class="eyebrow">DOCKER IMAGE LAYERS · ORDINARY UNSQUASHED LINUX CASE</text>
  <text x="48" y="83" class="title">A hidden file can still occupy an earlier layer.</text>
  <text x="48" y="120" class="small">Example: a NEW file, blob.bin · assumed 100 MB uncompressed payload · not measured</text>

  <path d="M652 157V486" class="line"/>
  <g id="layer-added">
    <text x="48" y="174" class="heading">TWO RUNs</text>
    <text x="48" y="203" class="small">Stored image layers — cutaway</text>
    <rect x="48" y="218" width="570" height="101" rx="9" class="panel"/>
    <text id="upper-label" x="69" y="246" class="small">RUN 1 · create the new file</text>
    <g id="newer-marker" visibility="hidden">
      <rect x="69" y="262" width="320" height="40" rx="5" fill="#d5b7ff"/>
      <text x="84" y="290" class="mono ink" style="font-size:22px">.wh.blob.bin</text>
      <text x="410" y="290" class="small">whiteout</text>
    </g>
    <rect id="lower-layer" x="48" y="335" width="570" height="87" rx="9" class="panel"/>
    <text id="lower-label" x="69" y="365" class="small">At the first RUN's end:</text>
    <text id="lower-state" x="69" y="398" class="small">record the resulting diff</text>
    <g id="payload-file" transform="translate(408 255)">
      <rect width="188" height="53" rx="5" class="payload"/>
      <text x="13" y="23" class="ink mono" style="font-size:20px">blob.bin</text>
      <text x="13" y="44" class="ink" style="font-size:19px">100 MB payload</text>
    </g>
  </g>

  <g id="later-delete">
    <rect x="48" y="438" width="570" height="46" rx="6" fill="#223547"/>
    <text x="66" y="468" class="small">Merged view</text>
    <text id="merged-state" x="238" y="468" class="small">blob.bin: being created</text>
    <rect id="merged-file" x="575" y="450" width="22" height="22" rx="3" class="payload" visibility="hidden"/>
  </g>

  <g id="same-run">
    <text x="687" y="174" class="heading">ONE RUN</text>
    <text id="right-intro" x="687" y="203" class="small">Alternative: delete before the diff is recorded</text>
    <rect x="687" y="218" width="545" height="204" rx="9" class="panel"/>
    <text id="run-phase" x="709" y="246" class="small">Same NEW file · different boundary</text>
    <path d="M726 267V350H1193V267" class="line"/>
    <text x="742" y="378" class="small">Before RUN</text>
    <text x="1090" y="378" class="small">After RUN</text>
    <text x="742" y="408" class="mint">absent</text>
    <text id="after-state" x="1090" y="408" class="small">—</text>
    <g id="temporary-file" visibility="hidden" transform="translate(866 274)">
      <rect width="188" height="53" rx="5" class="payload"/>
      <text x="13" y="23" class="mono ink" style="font-size:20px">blob.bin</text>
      <text x="13" y="44" class="ink" style="font-size:19px">100 MB payload</text>
    </g>
    <g id="delete-stroke" visibility="hidden">
      <path d="M881 284L1039 317M1039 284L881 317" stroke="#101923" stroke-width="5"/>
    </g>
    <text id="working-state" x="959" y="306" text-anchor="middle" class="small">create → delete → finish</text>
    <rect id="result-box" x="687" y="438" width="545" height="46" rx="6" fill="#223547"/>
    <text id="result-state" x="709" y="468" class="small">Compare the path at both endpoints.</text>
  </g>

  <g id="base-boundary">
    <text id="qualification" x="48" y="513" class="small">The illustration tracks this file only, not the image's total size.</text>
  </g>
  <text x="48" y="541" class="source">Sources: Docker “Image layers” / RUN best practices · OCI “Whiteouts” (af26a05) · Moby v27.5.1</text>
</svg>
<script>
(() => {
  const ids = [
    'upper-label', 'newer-marker', 'lower-layer', 'lower-label', 'lower-state',
    'payload-file', 'merged-state', 'merged-file', 'run-phase', 'after-state',
    'temporary-file', 'delete-stroke', 'working-state', 'result-box',
    'result-state', 'qualification'
  ];
  const nodes = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const show = (id, visible) => nodes[id].setAttribute('visibility', visible ? 'visible' : 'hidden');
  const label = (id, value) => { nodes[id].textContent = value; };
  const clamp = value => Math.max(0, Math.min(1, value));
  const smooth = value => { const t = clamp(value); return t * t * (3 - 2 * t); };

  // Index order is the unchanged narration.json order:
  // 0 layer-added, 1 later-delete, 2 same-run. Relative beats are not word alignment.
  window.ahaVideo = {
    async renderFrame({ frame, fps, segmentIndex, segmentFrame, segmentFrames, text }) {
      const segment = Math.max(0, Math.min(2, segmentIndex));
      const p = segmentFrames > 1 ? clamp(segmentFrame / (segmentFrames - 1)) : 1;
      const committed = segment > 0 || p >= 0.52;
      const whiteout = segment > 1 || (segment === 1 && p >= 0.40);
      const markerEntering = segment === 1 && p >= 0.10;
      const sameRun = segment === 2;
      const created = sameRun && p >= 0.12;
      const removed = sameRun && p >= 0.44;
      const finalized = sameRun && p >= 0.66;
      const travel = segment === 0 ? smooth((p - 0.12) / 0.40) : 1;

      nodes['payload-file'].setAttribute('transform', `translate(408 ${255 + 102 * travel})`);
      nodes['lower-layer'].setAttribute('stroke', committed ? '#ffce7a' : '#728699');
      nodes['lower-layer'].setAttribute('stroke-width', committed ? '3' : '2');
      label('lower-label', committed ? 'Layer 1 · immutable' : "At the first RUN's end:");
      label('lower-state', committed ? 'Earlier payload stays here' : 'record the resulting diff');
      label('upper-label', segment === 0 ? (committed ? 'RUN 1 finished · layer recorded' : 'RUN 1 · create the new file') : 'Layer 2 · later RUN deletes blob.bin');
      show('newer-marker', segment > 1 || markerEntering);
      const markerOffset = segment === 1 ? -12 * (1 - smooth((p - 0.10) / 0.30)) : 0;
      nodes['newer-marker'].setAttribute('transform', `translate(0 ${markerOffset})`);
      nodes['newer-marker'].setAttribute('opacity', segment === 1 ? smooth((p - 0.10) / 0.15) : 1);
      show('merged-file', committed && !whiteout);
      label('merged-state', whiteout ? 'blob.bin: absent' : committed ? 'blob.bin: present' : 'blob.bin: being created');

      label('run-phase', !sameRun ? 'Same NEW file · different boundary' : finalized ? 'RUN finished · compare endpoints' : removed ? 'Delete before this RUN finishes' : created ? 'Create inside this RUN' : 'Begin with no blob.bin');
      show('temporary-file', created && (!removed || p < 0.53));
      nodes['temporary-file'].setAttribute('opacity', removed ? 1 - smooth((p - 0.44) / 0.09) : 1);
      nodes['temporary-file'].setAttribute('transform', `translate(${866 + (created && !removed ? 12 * (1 - smooth((p - 0.12) / 0.12)) : 0)} 274)`);
      show('delete-stroke', removed && p < 0.53);
      nodes['delete-stroke'].setAttribute('opacity', removed ? 1 - smooth((p - 0.44) / 0.09) : 0);
      show('working-state', !created || (removed && p >= 0.53));
      label('working-state', !sameRun ? 'create → delete → finish' : removed ? 'No new file left at the boundary' : 'The new path starts absent');
      label('after-state', finalized ? 'absent' : '—');
      nodes['after-state'].setAttribute('class', finalized ? 'mint' : 'small');
      nodes['result-box'].setAttribute('stroke', finalized ? '#96e6cb' : 'none');
      nodes['result-box'].setAttribute('stroke-width', '2');
      label('result-state', finalized ? "Resulting diff: this file's payload not added" : 'Compare the path at both endpoints.');
      label('qualification', sameRun
        ? 'NEW file only. Preexisting lower-layer bytes stay; other changes or metadata may remain.'
        : whiteout
          ? 'Whiteout = deletion marker in the layer, not a visible file in the merged view.'
          : "The illustration tracks this file only, not the image's total size.");
    }
  };
})();
</script>
</body>
</html>
