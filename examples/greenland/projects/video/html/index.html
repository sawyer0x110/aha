<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why does Greenland look so big?</title>
<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; }
html, body { margin:0; width:1280px; height:720px; overflow:hidden; }
body { background:var(--cp-bg); color:var(--cp-text); font-family:"Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif; }
main { position:relative; width:1280px; height:720px; padding:30px 56px; }
.eyebrow { font-size:17px; font-weight:650; letter-spacing:3px; color:var(--cp-accent); }
h1 { font-size:44px; line-height:1.12; margin:10px 0 0; letter-spacing:-1px; }
svg { position:absolute; inset:124px 0 auto; width:1280px; height:380px; overflow:hidden; }
svg text { font-family:inherit; fill:var(--cp-text); }
.ocean { fill:var(--cp-bg-elevated); stroke:var(--cp-border); }
.land { fill:var(--cp-border); stroke:var(--cp-bg); stroke-width:.6; }
.africa { fill:#404040; stroke:var(--cp-bg); stroke-width:.6; }
.grid { fill:none; stroke:var(--cp-border-strong); stroke-width:.65; opacity:.5; }
.equator { fill:none; stroke:var(--cp-text-muted); stroke-width:1.4; stroke-dasharray:6 5; }
.greenland { fill:var(--cp-accent); stroke:var(--cp-accent-hover); stroke-width:1.5; }
.ghost { fill:var(--cp-accent-soft); stroke:var(--cp-accent); stroke-width:1.1; stroke-dasharray:4 4; }
.leader { fill:none; stroke:var(--cp-accent); stroke-width:1.3; }
.label { font-size:20px; font-weight:650; }
.small { font-size:17px; fill:var(--cp-text-muted); }
.strong { font-size:26px; font-weight:650; }
.big { font-size:48px; font-weight:700; letter-spacing:-1px; }
.number { font-size:64px; font-weight:700; letter-spacing:-2px; }
.accent { fill:var(--cp-accent); }
.line { fill:none; stroke:var(--cp-text); stroke-width:2; }
.accent-line { fill:none; stroke:var(--cp-accent); stroke-width:3; }
.patch { fill:var(--cp-accent-soft); stroke:var(--cp-accent); stroke-width:3; }
html[data-theme="dark"] .land { fill:#666361; }
html[data-theme="dark"] .africa { fill:#252525; stroke:#b0b0b0; stroke-width:1; }
html[data-theme="dark"] .small { fill:var(--cp-text-soft); }
html[data-theme="dark"] #source, html[data-theme="dark"] #note { color:var(--cp-text-soft); }
#note { position:absolute; left:64px; top:506px; font-size:17px; color:var(--cp-text-muted); }
#source { position:absolute; left:64px; top:529px; font-size:16px; color:var(--cp-text-muted); }
</style>
</head>
<body>
<main>
  <div id="eyebrow" class="eyebrow">A MATTER OF PROJECTION</div>
  <h1 id="heading">Why does Greenland look so big?</h1>
  <svg id="scene" viewBox="0 0 1280 380" role="img" aria-label="A geographical explanation of Mercator's area distortion."></svg>
  <div id="note"></div>
  <div id="source"></div>
</main>
<script src="../assets/geo.js"></script>
<script src="../assets/map-data.js"></script>
<script src="scenes.js"></script>
</body>
</html>
