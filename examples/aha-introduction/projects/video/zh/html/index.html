<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aha：研究方法、表达方式与安装使用</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing:border-box; }
html,body { width:1280px; height:720px; margin:0; overflow:hidden; }
body { background:var(--cp-bg); color:var(--cp-text); font-family:"Segoe UI",Aptos,Calibri,"Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif; }
main { position:relative; width:1280px; height:720px; }
#eyebrow { position:absolute; left:64px; top:28px; color:var(--cp-accent); font-size:17px; font-weight:650; letter-spacing:2px; }
h1 { position:absolute; left:64px; top:59px; margin:0; font-size:42px; line-height:1.12; letter-spacing:-1px; }
#scene { position:absolute; top:126px; left:0; width:1280px; height:366px; overflow:hidden; }
#note,#source { position:absolute; left:64px; right:64px; color:var(--cp-text-muted); line-height:22px; }
#note { top:500px; font-size:17px; }
#source { top:526px; font-size:16px; }
html[data-theme="dark"] #note,html[data-theme="dark"] #source { color:var(--cp-text-soft); }
svg text { font-family:inherit; fill:var(--cp-text); }
.label { font-size:24px; font-weight:600; }
.small { font-size:19px; fill:var(--cp-text-soft); }
.tiny { font-size:17px; fill:var(--cp-text-soft); }
.strong { font-size:32px; font-weight:650; }
.big { font-size:52px; font-weight:700; letter-spacing:-1px; }
.number { font-size:72px; font-weight:700; }
.mono { font-family:Consolas,"Courier New",Courier,monospace; font-size:27px; }
.accent { fill:var(--cp-accent); }
.box { fill:var(--cp-surface); stroke:var(--cp-border-strong); stroke-width:1.5; }
.selected { fill:var(--cp-accent-soft); stroke:var(--cp-accent); stroke-width:2; }
.line { fill:none; stroke:var(--cp-text-soft); stroke-width:2; }
.accent-line { fill:none; stroke:var(--cp-accent); stroke-width:3; }
.ocean { fill:var(--cp-bg-elevated); stroke:var(--cp-border-strong); }
.land { fill:var(--cp-border); stroke:var(--cp-bg); stroke-width:.6; }
.africa { fill:var(--cp-text-soft); stroke:var(--cp-bg); stroke-width:.6; }
.grid { fill:none; stroke:var(--cp-border-strong); stroke-width:.65; opacity:.55; }
.equator { fill:none; stroke:var(--cp-text-soft); stroke-width:1.3; stroke-dasharray:6 5; }
.greenland { fill:var(--cp-accent); stroke:var(--cp-accent-hover); stroke-width:1.2; }
.ghost { fill:var(--cp-accent-soft); stroke:var(--cp-accent); stroke-width:1.1; stroke-dasharray:4 4; }
.slot { fill:var(--cp-accent-soft); stroke:var(--cp-accent); stroke-width:2; }
.solid { fill:var(--cp-accent); }
.code { font-family:Consolas,"Courier New",Courier,monospace; font-size:23px; }
.center { text-anchor:middle; }
.muted { fill:var(--cp-text-muted); }
.removed { fill:none; stroke:var(--cp-text-soft); stroke-dasharray:7 5; stroke-width:2; }
.emphasis { fill:none; stroke:var(--cp-accent); stroke-width:4; }
.preview-frame { fill:var(--cp-surface); stroke:var(--cp-border-strong); stroke-width:1; }
main.showcase #scene { top:116px; height:382px; }
main.showcase h1 { font-size:38px; }
main.showcase #note { font-size:18px; }
</style>
</head>
<body>
<main>
<div id="eyebrow">AHA · 研究与解释</div>

<svg id="scene" viewBox="0 0 1280 366" role="img" aria-label="Aha 的研究方法、行为边界、四种表达方式与安装使用"></svg>
