</style></head><body><main class="film"><header><div class="eyebrow">anc · mechanism explained</div><h1 id="shot-title"></h1></header><div id="film-mechanism" class="mechanism"></div><p class="film-note" id="film-note"></p><div class="film-progress"><span id="progress"></span></div><p class="film-source">RWTH IKS · active noise control / Sony · noise-cancelling function · September 2026 research</p></main><script>(function installVisuals(topic) {
  const escape = value => String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const box = (heading, content, className = "") => `<div class="mechanism-box ${className}"><strong>${heading}</strong>${content}</div>`;

  let geography;

    const { geoArea, geoCentroid, geoRotation, geoMercator, geoPath, geoGraticule10 } = window.Geo;
    const features = window.MAP_DATA.features.map(feature => {
      const g = structuredClone(feature.geometry);
      const polygons = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
      for (const rings of polygons) {
        if (geoArea({ type: "Polygon", coordinates: rings }) > 2 * Math.PI) rings.forEach(ring => ring.reverse());
      }
      return { ...feature, geometry: g };

      const rotation = geoRotation([0, -center[1] * progress, 0]);
      const point = p => {
        const q = rotation([p[0] - center[0], p[1]]);
        return [((q[0] + center[0] + 540) % 360) - 180, q[1]];
      };
      const g = original.geometry;
      const moved = { type: g.type, coordinates: g.type === "Polygon" ? g.coordinates.map(r => r.map(point)) : g.coordinates.map(poly => poly.map(r => r.map(point))) };

    };

  function draw(holder, state = 0, language = "en", options = {}) {

      const phase = options.phase ?? state * 80;
      const delta = phase * Math.PI / 180;
      const residual = Math.sqrt(1 + gain * gain - 2 * gain * Math.cos(delta));

        <svg viewBox="0 0 800 220" class="waves" role="img" aria-label="${t("Two pressure waves and their sum at the same ear position", "同一耳边位置两路声压与其总和")}"><path class="axis" d="M0 110H800"/><path class="incoming" d="${curve(x => Math.sin(x))}"/><path class="control" d="${curve(x => -gain * Math.sin(x + delta))}"/><path class="wave-result" d="${curve(x => Math.sin(x) - gain * Math.sin(x + delta))}"/></svg>

        { cp: "U+4E2D", kind: 2, bytes: "200,076", utf: "100,003" },

    } else {

      const base = stage === "base";
      const layer = (label, text, cls = "") => `<div class="layer ${cls}"><b>${label}</b><span>${text}</span></div>`;
      html = `<div class="docker-comparison">
        <div><h3>${t("Separate RUNs", "分开的 RUN")}</h3><div class="layer-stack">${deletion ? layer(t("Later layer", "后加层"), ".wh.temp", "marker-layer") : '<div class="layer-placeholder"></div>'}${layer(deletion ? t("Earlier layer", "先前层") : t("First committed layer", "首个提交层"), "/temp · 100 MB", "payload-layer")}</div><div class="merged"><b>${t("Merged view", "合并视图")}</b><strong>${deletion ? t("/temp absent", "/temp 不存在") : t("/temp visible", "/temp 可见")}</strong></div></div>
        <div><h3>${t("Same RUN · NEW file", "同一 RUN · 新文件")}</h3><div class="endpoint"><span>${t("Before: absent", "之前：不存在")}</span><span>${t("Create → delete", "创建 → 删除")}</span><span>${t("After: absent", "之后：不存在")}</span></div><div class="merged"><b>${t("Resulting diff", "生成的差异")}</b><strong>${t("No payload for this file", "没有此文件的载荷")}</strong></div></div></div>
        <p class="model-label ${base ? "emphasis" : ""}">${base ? t("Base-file exception: deleting a file already in the base still leaves its lower-layer bytes.", "基础层反例：删除基础层已有文件，仍会保留下层字节。") : t("Layer cutaway ≠ merged view. 100 MB assumed; no build executed.", "层剖面 ≠ 合并视图。100 MB 为假设；未执行构建。")}</p>`;
      holder.dataset.stage = stage;
    }
    holder.innerHTML = html;
  }
  window.drawMechanism = draw;
  for (const section of document.querySelectorAll("[data-aha-lang]")) {
    const holder = section.querySelector(".mechanism");
    const language = section.dataset.ahaLang;
    const update = () => {
      if (topic === "anc") draw(holder, 0, language, { gain: Number(section.querySelector(".gain").value), phase: Number(section.querySelector(".phase").value) });
      else if (topic === "greenland") draw(holder, Number(section.querySelector(".position").value), language);

    };
    section.querySelectorAll("input,select").forEach(input => input.addEventListener("input", update));

  }
})("anc");
document.documentElement.dataset.theme = new URLSearchParams(location.search).get("scoutTheme") || "light";
const titles=["Two pressures meet at your ear","Matching at the ear, not at the microphone","Timing changes the residual","The same error takes more of a faster cycle","Passive isolation still matters","Reduced does not mean inaudible","Fit and mode change the result"], topic="anc";
const holder=document.getElementById("film-mechanism");

    if(segmentIndex===3) note="Greenland spans multiple latitudes. The local 4× factor is not its total magnification.";
