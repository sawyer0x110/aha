:root { --cp-bookend:#292929; --cp-bookend-text:#dedede; --cp-paper:#fcfbf8; --cp-ink:#242424; --cp-rose:#b11f4b; }
main { padding:36px 64px; width:1280px; height:720px; background:var(--cp-paper); color:var(--cp-ink); }

h1 {line-height:1.1; font-size:43px; max-width:1130px; margin:0; height:100px;}
#kicker {font-size:17px;letter-spacing:.1em;margin:0 0 14px}
#visual {position:absolute;left:64px;top:188px;width:1152px;height:300px;}
svg {width:100%;height:100%;} svg text{font:22px "Segoe UI",sans-serif;fill:var(--cp-ink)}
#meaning {position:absolute;top:475px;left:64px;width:1152px;font-size:25px;line-height:1.2;margin:0;}
#source {position:absolute;top:524px;left:64px;width:1152px;font-size:16px;line-height:1;margin:0;}
.dark #source,.dark #meaning{color:var(--cp-bookend-text)}
.dark svg text{fill:var(--cp-bookend-text)}
#bookend {font-size:38px;line-height:1.3;max-width:1000px;padding-top:28px;}

</style></head><body>
<main id="stage"><p id="kicker">ACTIVE NOISE CANCELLATION / PRESSURE AT THE EAR</p><h1 id="title">Why aircraft rumble fades, but voices remain</h1>
<div id="visual">
<div id="bookend">ANC works on pressure at your ear.<br>It does not mute a category called “noise”.</div>
<svg id="waves" viewBox="0 0 1152 300" role="img" aria-label="Deterministic single-tone pressure traces at the ear, not measured headphone performance" hidden>
<text x="0" y="27">Incoming</text><text x="0" y="119">Control</text><text x="0" y="211">Residual</text>
<path d="M155 48 H920 M155 140 H920 M155 232 H920" stroke="var(--cp-border)" stroke-width="2"/>
<path id="incoming" fill="none" stroke="var(--cp-ink)" stroke-width="4"/>
<path id="control" fill="none" stroke="var(--cp-rose)" stroke-width="4" stroke-dasharray="10 6"/>
<path id="residual" fill="none" stroke="var(--cp-ink)" stroke-width="5"/>
<text x="947" y="48">Same ear</text><text id="condition" x="947" y="145">Matched</text><text id="residual-value" x="947" y="238">0.00 ×</text>
<text x="155" y="291">Time → one cycle · normalized pressure · ideal model</text>
</svg>
<div id="comparison" class="row" hidden><div class="card"><div id="left-label" class="label"></div><div id="left-text"></div></div><div class="card"><div id="right-label" class="label"></div><div id="right-text"></div></div></div>
</div><p id="meaning">Some voice components can shrink while others remain audible.</p><p id="source">Sony WH-1000XM5 Help Guide · helpguide.sony.net</p>
</main><script>
const scenes=[
 {type:'book',title:'Why aircraft rumble fades, but voices remain',body:'ANC works on pressure at your ear.\nIt does not mute a category called “noise”.',meaning:'Some voice components can shrink while others remain audible.',source:'Sony WH-1000XM5 Help Guide · helpguide.sony.net'},
 {type:'wave',title:'The ear receives a sum of pressures',kind:'arrive',meaning:'Incoming pressure + speaker pressure = residual at this target.',source:'RWTH IKS, Principle · iks.rwth-aachen.de'},
 {type:'wave',title:'Match the pressure after both acoustic paths',kind:'match',meaning:'Equal amplitude, opposite phase: the ideal residual shrinks to zero.',source:'Hilgemann et al., §2.1–2.2 · arxiv.org/html/2509.15864v1'},
 {type:'wave',title:'Change the phase. Watch the residual return.',kind:'slip',meaning:'Equal amplitude is not enough if arrival timing is wrong.',source:'Analytical single-tone illustration · RWTH IKS path/latency context'},
 {type:'compare',title:'The same delay takes more of a faster cycle',leftLabel:'100 Hz',left:'3.6° phase error',rightLabel:'1000 Hz',right:'36° phase error',meaning:'Illustrative uncorrected error: 0.10 ms. Not a measured earbud delay.',source:'Derived from phase error = 2π × frequency × delay'},
 {type:'compare',title:'Not a universal frequency wall',leftLabel:'TIMING AND PATHS',left:'Reference preview\nAcoustic propagation',rightLabel:'CONTROL LIMITS',right:'Bandwidth\nFeedback stability',meaning:'Frequency tightens conditions; it does not classify speech as impossible.',source:'RWTH IKS · Hilgemann et al., §2'},
 {type:'compare',title:'Passive and active do different jobs',leftLabel:'PASSIVE',left:'Seal and ear cup\nchange transmission',rightLabel:'ACTIVE',right:'Speaker adds\ncontrol pressure',meaning:'ANC off still leaves the physical barrier in place.',source:'Hilgemann et al., §2.1 and §2.3 · arxiv.org/html/2509.15864v1'},
 {type:'compare',title:'Speech can be reduced and still heard',leftLabel:'ATTENUATED COMPONENTS',left:'Some parts\nbecome weaker',rightLabel:'RESIDUAL COMPONENTS',right:'Enough remains\nto be audible',meaning:'A voice is not one high-frequency tone.',source:'Sony WH-1000XM5 Help Guide · RWTH IKS own-voice discussion'},
 {type:'compare',title:'Speech is not immune to active control',leftLabel:'CLOSED EAR CANAL',left:'Own-voice low frequencies\ncan be enhanced',rightLabel:'ACTIVE OCCLUSION CONTROL',right:'Can reduce that\nvoice enhancement',meaning:'A counterexample to “voice pressure cannot be cancelled”.',source:'RWTH IKS, Applications: Occlusion Effect Reduction'},
 {type:'compare',title:'Do not turn that counterexample into a promise',leftLabel:'WHAT IT SHOWS',left:'Voice pressure\ncan be controlled',rightLabel:'WHAT IT DOES NOT SHOW',right:'Another person’s\nwhole voice erased',meaning:'More noticeable speech does not prove its pressure was amplified.',source:'Scope distinction from RWTH IKS and Sony guidance'},
 {type:'compare',title:'Mode can change what gets through',leftLabel:'ANC',left:'Adds anti-noise',rightLabel:'TRANSPARENCY',right:'Intentionally lets\noutside sound in',meaning:'Adaptive modes may change the balance. Check your actual setting.',source:'Apple Support · support.apple.com/en-us/108918'},
 {type:'compare',title:'Fit changes the sound paths',leftLabel:'KEEP CONSTANT',left:'Seal and position',rightLabel:'COMPARE',right:'ANC on / off\nwith the same source',meaning:'Removing the headphones is a different baseline.',source:'Sony Help Guide · Hilgemann et al., §2.2'},
 {type:'compare',title:'A model is not your measured ear',leftLabel:'PUBLISHED PROTOTYPE',left:'Response varied\nwith wearer and fit',rightLabel:'THIS EXPLANATION',right:'No new acoustic test\nNo personal decibel claim',meaning:'The original authors’ results do not predict your flight.',source:'Hilgemann et al., §6.3 · arxiv.org/html/2509.15864v1'},
 {type:'book',title:'Ask what remains at the ear',body:'Path. Timing. Fit. Mode.\nNot “engine” versus “voice”.',meaning:'Audible speech can still be attenuated. No universal frequency wall.',source:'RWTH IKS · Sony Help Guide · Apple Support · Hilgemann et al.'}
];
const byId=id=>document.getElementById(id);
function trace(fn,center,shift){
  return Array.from({length:181},(_,i)=>`${i?'L':'M'}${155+i*765/180},${center-32*fn(i*2*Math.PI/180-shift)}`).join(' ');
}
window.ahaVideo={async renderFrame({frame,fps,segmentIndex,segmentFrame,segmentFrames,text}){
  const index=Math.max(0,Math.min(scenes.length-1,segmentIndex));
  const s=scenes[index],p=segmentFrames>1?segmentFrame/(segmentFrames-1):1;
  byId('stage').className=s.type==='book'?'dark':'';
  byId('title').textContent=s.title;byId('meaning').textContent=s.meaning;byId('source').textContent=s.source;
  byId('bookend').hidden=s.type!=='book';byId('waves').toggleAttribute('hidden',s.type!=='wave');byId('comparison').hidden=s.type!=='compare';
  byId('bookend').textContent=s.body||'';byId('bookend').style.whiteSpace='pre-line';
  for(const side of ['left','right']){byId(side+'-label').textContent=s[side+'Label']||'';byId(side+'-text').textContent=s[side]||'';byId(side+'-text').style.whiteSpace='pre-line';}
  const gain=s.kind==='arrive'?0:s.kind==='match'?Math.min(1,p*1.5):1;
  const delta=s.kind==='slip'?Math.min(1,p*1.5)*Math.PI/3:0;
  const shift=2*Math.PI*p;
  byId('incoming').setAttribute('d',trace(t=>Math.sin(t),48,shift));
  byId('control').setAttribute('d',trace(t=>-gain*Math.sin(t-delta),140,shift));
  byId('residual').setAttribute('d',trace(t=>Math.sin(t)-gain*Math.sin(t-delta),232,shift));
  byId('condition').textContent=s.kind==='slip'?`${Math.round(delta*180/Math.PI)}° error`:`gain ${gain.toFixed(2)}`;
  byId('residual-value').textContent=`${Math.sqrt(Math.max(0,1+gain*gain-2*gain*Math.cos(delta))).toFixed(2)} ×`;
}};
</script>
</body></html>
